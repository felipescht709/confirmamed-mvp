services:
  redis:
    image: redis:6.2-alpine
    container_name: confirmamed_redis
    restart: unless-stopped
    # 🔒 Segurança: Exige senha e define política de despejo de memória (Allkeys-lru)
    command: redis-server --requirepass ${REDIS_PASSWORD:-senha_segura_aqui} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379" # Mapeado para você conseguir inspecionar com o Redis Insight na sua máquina local
    networks:
      - confirmamed_net
    volumes:
      - redis_data:/data

  # --- WHATSAPP ENGINE (EVOLUTION API) ---
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: always
    entrypoint: ["npm", "run", "start:prod"]
    privileged: true
    user: "root"
    shm_size: '2gb'
    environment:
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=admin123
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=evolution&sslmode=require&pgbouncer=true
      - DATABASE_CONNECTION_CLIENT_NAME=confirmamed_evo
      # Variáveis de persistência v2
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_INSTANCE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution_v2
      - LOG_LEVEL=DEBUG,INFO,ERROR,WARN
      - WEB_BROWSER_HEADLESS=true
      # Argumentos simplificados para evitar crash de engine
      - WEB_BROWSER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      # Novas Variáveis de Estabilidade (v2.4.1)
      - WA_BUSINESS_COMPLIANCE=false
      - CONFIG_SESSION_CHAT_SYNC=false
      - WEB_BROWSER_CONFIG_SKIP_BROWSERS_CHECK=true
      # Dashboard Evolution v2
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-true}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin123}
      # Configuração de Webhook Global (Ponta de Retorno)
      - WEBHOOK_GLOBAL_URL=http://backend:4000/api/webhooks/whatsapp
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      # URL externa para a Evolution se reconhecer
      - SERVER_URL=${SERVER_URL:-http://localhost:8085}
    ports:
      - "8085:8080"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--header=apikey: admin123", "http://localhost:8080/instance/fetchInstances" ]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - evolution_sessoes:/evolution/instances
    networks:
      confirmamed_net:
        aliases:
          - evolution
          - ngrok_net

  # --- NOSSA APLICAÇÃO ---
  backend:
    build: ./backend
    container_name: confirmamed_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL=${DB_SSL}
      - EVOLUTION_URL=http://evolution:8080
      - WHATSAPP_BASE_URL=http://evolution:8080
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/home/node/app
      - /home/node/app/node_modules
    networks:
      - confirmamed_net

  frontend:
    build: ./frontend
    container_name: confirmamed_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - VITE_API_URL=http://localhost:4000/api
    volumes:
      - ./frontend:/home/node/app
      - /home/node/app/node_modules
    depends_on:
      - backend
    networks:
      - confirmamed_net
    stdin_open: true
    tty: true

  # --- TÚNEL PARA WEBHOOKS ---
  ngrok:
    image: ngrok/ngrok:latest
    container_name: confirmamed_ngrok
    restart: unless-stopped
    command:
      - http
      - backend:4000
      - --url=carlo-unquarried-jenell.ngrok-free.dev
    environment:
      - NGROK_AUTHTOKEN=${token_ngrok:?erro_token_ausente}
    depends_on:
      - backend
    networks:
      - confirmamed_net

networks:
  confirmamed_net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1350"
  ngrok_net:
    # Define ngrok network for unified webhooks
    driver: bridge

volumes:
  pgdata:
  redis_data:
    driver: local
  evolution_sessoes:
    driver: local
